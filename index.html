<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arena Prompt Combat</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1419; color: #e8eaed; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      #app { height: 100%; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #arena-wrap { flex: 1 1 62%; min-height: 0; }
      #sheet-wrap { flex: 0 0 32%; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
